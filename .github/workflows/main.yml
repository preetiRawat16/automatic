name: Fetch Stock Prices

on:
  schedule:
    - cron: '0 11 * * *'  # Runs at 11:00 UTC (3 PM Dubai Time)

jobs:
  fetch_stock_prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests gspread oauth2client

      - name: Run script
        run: python fetch_stock_prices.py
